services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ipp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ipp_password}
      POSTGRES_DB: ${POSTGRES_DB:-ipp}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ipp}"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: deployment/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ipp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ipp_password}
      POSTGRES_DB: ${POSTGRES_DB:-ipp}
      POSTGRES_HOST: db
      LOCAL_ARTIFACT_DIR: /app/invoice_artifacts/
    ports:
      - "8000:8000"
    volumes:
      - artifacts:/app/invoice_artifacts

volumes:
  pgdata:
  artifacts:
